<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>installCanvas Embed</title>
<style>
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #080808; overflow: hidden; font-family: monospace; }
  
</style>
</head>
<body>
<div style="width:100%; height:100%; position:relative;"><canvas id="installCanvas" style="position:absolute; inset:0; width:100%; height:100%; display:block;"></canvas></div>
<script>
(function() {
const canvas = document.getElementById('installCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, t = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.offsetWidth;
    H = canvas.offsetHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  resize();
  window.addEventListener('resize', resize);
// Grid of cells that respond to a wave
  const cols = 18, rows = 12;

  function frame() {
    ctx.fillStyle = 'rgba(10,10,10,0.25)';
    ctx.fillRect(0, 0, W, H);

    const cw = W / cols, ch = H / rows;

    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const cx = (c + 0.5) * cw, cy = (r + 0.5) * ch;
        const dist = Math.hypot(c - cols / 2, r - rows / 2);
        const wave = Math.sin(dist * 0.6 - t * 1.8) * 0.5 + 0.5;
        const wave2 = Math.sin(c * 0.4 + t * 0.7) * Math.cos(r * 0.5 - t * 0.5) * 0.5 + 0.5;
        const v = wave * 0.6 + wave2 * 0.4;
        const size = 1 + v * (Math.min(cw, ch) * 0.38);
        const alpha = 0.1 + v * 0.7;

        ctx.beginPath();
        // Alternate between square and circle
        if ((c + r) % 3 === 0) {
          ctx.arc(cx, cy, size * 0.5, 0, Math.PI * 2);
        } else {
          ctx.rect(cx - size * 0.4, cy - size * 0.4, size * 0.8, size * 0.8);
        }
        ctx.fillStyle = `rgba(232,248,0,${alpha})`;
        ctx.fill();
      }
    }

    t += 0.018;
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
